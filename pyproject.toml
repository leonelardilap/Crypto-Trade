[project]
name = "crypto-trade"
version = "0.1.0"
description = "Adaptive quantitative trading system for cryptocurrency markets"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
include = ["src*"]
